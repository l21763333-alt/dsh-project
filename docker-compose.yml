services:
  # ---- MySQL 8（默认数据库）----
  mysql:
    image: mysql:8.0
    container_name: recruit-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DB:-recruit_ai}
      MYSQL_USER: ${MYSQL_USER:-recruit}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-recruit123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ---- Recruit AI 应用（后端 + 前端单端口）----
  app:
    build: .
    container_name: recruit-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 数据库连接走容器网络（host 名 mysql）
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-recruit}:${MYSQL_PASSWORD:-recruit123}@mysql:3306/${MYSQL_DB:-recruit_ai}?charset=utf8mb4
      # LLM：Key 从 .env 注入（严禁写死）
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      STORAGE_PATH: /app/data/files
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  mysql_data:
  app_data:
